<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" /><link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
		<title>table formatter</title>
	</head>
<body>
	<details id="usage" class="font">
		<summary>使い方</summary>
		<ol class="usage-contents">
			<li>表をテキストボックスに入力してください。</li>
			<li>次に入力フォーマットのボタンをクリックしてください。</li>
			<li>クリックすると出力フォーマットのボタンが表示されます。</li>
			<li>必要なフォーマットをクリックすると表がコピーされるので、好きな場所にペーストしてください。</li>
		</ol>
		<p class="usage-contents">※エクセルは範囲選択するとそのままコピーできます。また、ペーストすると選択されたセルが左上になるよう表が貼り付けられます。フォーマットは「tab&enter(Excel)」を使用してください。</p>
	</details>
	<textarea name="入力" id="input" class="font"></textarea>
	<div id="subInput" class="area">
		<button id="clear" class="mini-button font">clear</button>
		<p class="tag font">入力時クリア：</p>
		<input type="checkbox" id="input-clear" class="check">
		<p class="tag font">最適推定値の列：</p>
		<input type="number" id="estimate-colmun-offset" value="1" class="number">
	</div>
	<div class="tab font">入力フォーマット</div>
	<div id="selectorArea" class="area"></div>
	<div class="tab font">出力フォーマット</div>
	<div id="outputs" class="area"></div>
</body>
<script>
	//初期値
	const INPUT_CLEAR = true;
	/*
	テンプレートを追加するには：
	templates配列にフォーマットを追加します。
		name: 名称
		color: ボタンの色
		column: 行を分ける文字列
		row: 列を分ける文字列
		pmParting: 最適推定値と不確かさを分ける文字列。空ならば二列に分けて記述されていると判断
		eParting: 10のn乗を併記する際のnの左に置く文字列を指定。大文字小文字を区別する
		header: 出力の先頭につける文字列
		footer: 出力の末尾につける文字列
	コピペ用：
		{
			name: "",
			color: "",
			column: "",
			row: "",
			pmParting: "",
			eParting: "",
			header:"",
			footer:""
		},
	*/
	const templates = [
		{
			name: "latex",
			color: "skyblue",
			column: "\\\\\n",
			row: " & ",
			pmParting: "+-",
			eParting: "e",
			header:"",
			footer:"",
		},
		{
			name: "matlab",
			color: "orange",
			column: "; ",
			row: " ",
			pmParting: "",
			eParting: "e",
			header:" = [",
			footer:"];",
		},
		{
			name: "tab&enter(Excel)",
			color: "mediumseagreen",
			column: "\n",
			row: "\t",
			pmParting: "",
			eParting: "E",
			header:"",
			footer:"",
		},
		{
			name: "dot&enter",
			color: "violet",
			column: "\n",
			row: ".",
			pmParting: "",
			eParting: "*",
			header:"",
			footer:"",
		},
	];

	function eExpander(value, offset, parting) {
		let separated = value.split(parting);
		if (separated.length == 1) {
			separated.push(0);
		}
		separated[1] = Number(separated[1]) + offset;
		return separated
	}

	function setDecimalPointZero(significand, exponent) {
		let separated = significand.split(".");
		if (separated[0] == "0") {
			let normalizedExponent = exponent;
			while ((separated[1] ?? "1").substring(0, 1) == "0") {
				separated[1] = separated[1].substring(1);
				normalizedExponent -= 1;
			}
			if (!separated[1]) {
				return [0, 0]
			}
			return [`0.${separated[1]}`, normalizedExponent]
		}
		
		let connected = `0.${separated[0]}${separated[1] ?? ""}`;
		return [connected, exponent + separated[0].length]
	}

	function setExponent(significand, exponent, targetExponent) {
		let [normalizedSignificand, normalizedExponent] = setDecimalPointZero(significand, exponent);

		return shiftDecimalPoint(normalizedSignificand, normalizedExponent, normalizedExponent - targetExponent)
	}

	function shiftDecimalPoint(significand, exponent, targetIntegerDigit) {
		let [normalizedSignificand, normalizedExponent] = setDecimalPointZero(significand, exponent);
		if (normalizedSignificand == "0") {
			return ["0", 0]
		}

		let [_, connected] = normalizedSignificand.split(".");

		let newExponent = normalizedExponent - targetIntegerDigit;

		let newSignificand = "";
		if (targetIntegerDigit < 0) {
			newSignificand = `0.${"0".repeat(targetIntegerDigit * -1)}${connected}`;
			return [newSignificand, newExponent]
		}
		newSignificand = `${connected.substring(0, targetIntegerDigit) || "0"}`;
		let tailZeroCount = targetIntegerDigit - connected.length;
		if (tailZeroCount < 0) {
			newSignificand += `.${connected.substring(targetIntegerDigit)}`;
		} else {
			newSignificand += "0".repeat(tailZeroCount);
		}

		return [newSignificand, newExponent]
	}

	function spliter(inputArea, template) {
		let table = [];
		
		const rows = inputArea.value.split(template.column);

		for (const row of rows) {
			const cells = row.split(template.row);
			table.push(cells);
		}
		return table;
	}

	function scientificNotationExpander(rawArray, notationOffset, template) {
		let processedArray = rawArray.slice(0, notationOffset - 1);
		if (template.pmParting == "") {
			processedArray.push(...eExpander(rawArray[notationOffset - 1], 0, template.eParting));
			processedArray.push(...eExpander(rawArray[notationOffset], 0, template.eParting));
			processedArray.push(...rawArray.slice(Number(notationOffset) + 1));
			return processedArray
		}

		let parts = rawArray[notationOffset - 1].split(template.pmParting);
		if (parts[1]) {
			let exponent = eExpander(parts[1], 0, template.eParting);
			processedArray.push(parts[0], exponent[1], ...exponent);
			processedArray.push(...rawArray.slice(notationOffset));
			return processedArray
		}

		let significand = eExpander(parts[0], 0, template.eParting);
		processedArray.push(...significand, 0, 0);
		processedArray.push(...rawArray.slice(notationOffset));
		return processedArray
	}

	function scientificNotationCompressor(rawArray, notationOffset, template) {
		let processedArray = rawArray.slice(0, notationOffset - 1);

		let estimate = shiftDecimalPoint(rawArray[notationOffset - 1], rawArray[notationOffset], 1);
		let uncertainty = setExponent(rawArray[Number(notationOffset) + 1], rawArray[Number(notationOffset) + 2], estimate[1]);

		//ここで必要に応じて四捨五入の処理

		if (template.pmParting == "") {
			processedArray.push(`${estimate[0]}${template.eParting}${estimate[1]}`);
			processedArray.push(`${uncertainty[0]}${template.eParting}${uncertainty[1]}`);
		} else {
			let notation = `${estimate[0]}${template.pmParting}${uncertainty[0]}${template.eParting}${estimate[1]}`;
			processedArray.push(notation);
		}

		processedArray.push(...rawArray.slice(Number(notationOffset) + 3));
		return processedArray
	}

	function generator(table){
		outputarea = document.getElementById("outputs");

		while(outputarea.firstChild){
			outputarea.removeChild(outputarea.firstChild);
		}

		//generate output
		for (const template of templates) {
			let outputText = template.header;
			for (row of table) {
				for (cell of row) {
					outputText += cell;
					outputText += template.row;
				}
				outputText = outputText.substring(0, outputText.length - template.row.length);
				outputText += template.column;
			}
			outputText = outputText.substring(0, outputText.length - template.column.length);
			outputText += template.footer;

			let output = document.createElement("button");
			output.textContent = template.name;
			output.classList.add("button");
			output.classList.add("font");
			output.style.backgroundColor = template.color;
			output.addEventListener("click", () => {
				navigator.clipboard.writeText(outputText);
			});
			outputarea.appendChild(output);
		}
	}

	function selectorSetter(){
		let selectorArea = document.getElementById("selectorArea");
		for(const template of templates) {
			let selector = document.createElement("button");
			selector.textContent = template.name;
			selector.classList.add("button");
			selector.classList.add("font");
			selector.style.backgroundColor = template.color;
			selector.addEventListener("click", () => {
				let inputArea = document.getElementById("input");
				let estimateColumnOffset = document.getElementById("estimate-colmun-offset").value;
				if (estimateColumnOffset < 1) {
					estimateColumnOffset = 1;
				}

				let rawMatrix = spliter(inputArea, template);
				let processedMatrix = [];
				for (rawArray of rawMatrix) {
					console.log(rawArray);
					let expanded = scientificNotationExpander(rawArray, estimateColumnOffset, template);
					console.log(expanded)
					let compressed = scientificNotationCompressor(expanded, estimateColumnOffset, template);
					processedMatrix.push(compressed);
				}
				generator(processedMatrix);

				if (document.getElementById("input-clear").checked){
					let inputArea = document.getElementById("input");
					inputArea.value = "";
				}
			});
			selectorArea.appendChild(selector);
		}
	}

	document.getElementById("input-clear").checked = INPUT_CLEAR;
	selectorSetter();

	document.getElementById("clear").addEventListener("click", () => {
		let inputArea = document.getElementById("input");
		inputArea.value = "";
	});

</script>
<style>
	body{
		display: flex;
		flex-direction: column;
		margin: 10px;
		padding: 0;
	}
	#input{
		width: auto;
		height: 8rem;
		resize: none;
		border: 1.5px solid gray;
		border-radius: 0.5rem;
	}
	#sub-input{
		display: flex;
		flex-direction: row;
	}
	.tag{
		margin: 5px;
		margin-left: 20px;
		margin-right: 0;
	}
	.tab{
		width: max-content;
		margin-top: 5px;
		border: 1.5px solid gray;
		border-radius: 2px 2px 0.5rem;
		padding: 5px 12px;
		background-color: #ccc;
		font-size: 1.2rem;
	}
	.area{
		display: flex;
		flex-direction: row;
		align-items: center;
		padding-left: 15px;
	}
	.button{
		margin: 5px;
		border: 1.5px solid gray;
		border-radius: 0.5rem;
		padding: 5px 12px;
		font-size: 1.2rem;
	}
	.mini-button{
		margin: 5px;
		border: 1.5px solid gray;
		border-radius: 0.5rem;
		padding: 2.5px 6px;
		font-size: 1rem;
	}
	.check{
		width: 1.2rem;
		height: 1.2rem;
	}
	.number{
		width: 3rem;
	}
	#usage{
		margin-bottom: 10px;
		border: 1.5px solid gray;
		border-radius: 2px 2px 0.5rem;
		padding: 2px 7px;
	}
	.usage-contents{
		margin: 12px;
		margin-bottom: 7px;
	}
	.font{
	font-family: "Noto Sans JP", sans-serif;
	font-optical-sizing: auto;
	font-weight: 500;
	font-style: normal;
	}
</style>
</html>
